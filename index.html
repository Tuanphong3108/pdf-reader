        }
        function strokePath(ctx, pts) {
            ctx.beginPath();
            if (pts.length === 1) { ctx.arc(pts[0][0], pts[0][1], ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); return; }
            ctx.moveTo(pts[0][0], pts[0][1]);
            for (let i = 1; i < pts.length - 1; i++) ctx.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
            ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
            ctx.stroke();
        }
        function redrawSig() {
            const ctx = sigCanvas.getContext('2d'), dpr = window.devicePixelRatio || 1;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.strokeStyle = ctx.fillStyle = sigInk();
            ctx.lineWidth = 3; ctx.lineCap = ctx.lineJoin = 'round';
            sigStrokes.forEach(s => strokePath(ctx, s));
            $('sig-hint').style.visibility = sigStrokes.length ? 'hidden' : 'visible';
        }
        function openSigDialog() {
            sigStrokes = []; sigCur = null;
            $('sig-modal').classList.add('active');
            requestAnimationFrame(sizeSigCanvas);
        }
        function closeSigDialog() { $('sig-modal').classList.remove('active'); }
        function clearSigPad() { sigStrokes = []; redrawSig(); }
        $('sig-modal').addEventListener('pointerdown', e => { if (e.target === $('sig-modal')) closeSigDialog(); });
        sigCanvas.addEventListener('pointerdown', e => {
            e.preventDefault();
            sigCanvas.setPointerCapture(e.pointerId);
            const r = sigCanvas.getBoundingClientRect();
            sigCur = [[e.clientX - r.left, e.clientY - r.top]];
            sigStrokes.push(sigCur);
            redrawSig();
        });
        sigCanvas.addEventListener('pointermove', e => {
            if (!sigCur) return;
            const r = sigCanvas.getBoundingClientRect();
            for (const c of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e])) sigCur.push([c.clientX - r.left, c.clientY - r.top]);
            redrawSig();
        });
        const sigEnd = () => { sigCur = null; };
        sigCanvas.addEventListener('pointerup', sigEnd);
        sigCanvas.addEventListener('pointercancel', sigEnd);
        window.addEventListener('resize', () => { if ($('sig-modal').classList.contains('active')) sizeSigCanvas(); });

        function finishSigDialog() {
            if (!sigStrokes.length) { closeSigDialog(); return; }
            let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
            sigStrokes.forEach(s => s.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }));
            const m = 6, K = 2;
            const w = Math.max(8, x1 - x0 + 2 * m), h = Math.max(8, y1 - y0 + 2 * m);
            const c = document.createElement('canvas');
            c.width = Math.ceil(w * K); c.height = Math.ceil(h * K);
            const ctx = c.getContext('2d');
            ctx.setTransform(K, 0, 0, K, -(x0 - m) * K, -(y0 - m) * K);
            ctx.strokeStyle = ctx.fillStyle = '#111111';
            ctx.lineWidth = 3.2; ctx.lineCap = ctx.lineJoin = 'round';
            sigStrokes.forEach(s => strokePath(ctx, s));
            sigs.unshift({ src: c.toDataURL('image/png'), w: w, h: h });
            sigs = sigs.slice(0, 6);
            activeSig = 0;
            saveSigs();
            closeSigDialog();
            renderPanel();
        }

        // ====================================================================
        //  Thông tin tệp
        // ====================================================================
        async function openInfo() {
            if (!pdfDoc) return;
            closeMenu();
            let info = {};
            try { info = (await pdfDoc.getMetadata()).info || {}; } catch (e) {}
            const body = $('info-body');
            body.textContent = '';
            const row = (ic, title, sub) => el('div', { class: 'info-row' }, icon(ic), el('div', {}, el('div', { class: 'info-title', text: title }), el('div', { class: 'info-sub', text: sub })));
            body.append(
                row('picture_as_pdf', 'Tài liệu PDF', fmtSize(fileInfo.size)),
                row('calendar_today', 'Ngày sửa đổi', fmtDate(fileInfo.lastModified)),
                row('description', 'Số lượng trang', String(pdfDoc.numPages)),
                row('calendar_today', 'Ngày tạo', fmtDate(parsePdfDate(info.CreationDate))),
                el('div', { class: 'info-divider' }));
            const kv = [
                ['Ứng dụng:', info.Creator], ['Phần mềm chuyển đổi:', info.Producer], ['Phiên bản PDF:', info.PDFFormatVersion],
                ['Chế độ xem nhanh trên web:', info.IsLinearized ? 'Có' : 'Không']
            ];
            if (info.Title) kv.push(['Tiêu đề:', info.Title]);
            if (info.Author) kv.push(['Tác giả:', info.Author]);
            const grid = el('div', { class: 'info-kv' });
            kv.forEach(([k, v]) => grid.append(el('div', { class: 'k', text: k }), el('div', { class: 'v', text: v ? String(v) : '—' })));
            body.append(grid);
            $('info-sheet').hidden = false;
        }
        function closeInfo() { $('info-sheet').hidden = true; }

        // ====================================================================
        //  Chia sẻ, menu phụ
        // ====================================================================
        async function shareFile() {
            if (!pdfDoc) return;
            if (isDirty()) { toast('Hãy lưu thay đổi trước khi chia sẻ.'); return; }
            try {
                const bytes = await pdfDoc.getData();
                const file = new File([bytes], fileInfo.name || 'tai-lieu.pdf', { type: 'application/pdf' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: file.name });
                else toast('Thiết bị này không hỗ trợ chia sẻ tệp.');
            } catch (e) { if (!e || e.name !== 'AbortError') toast('Không chia sẻ được: ' + (e && e.message ? e.message : e)); }
        }

        function openMoreMenu(anchor) {
            const has = !!pdfDoc;
            openMenu(anchor, [
                { label: 'Mở tệp…', icon: 'file_open', onClick: openFile },
                { label: 'Thông tin', icon: 'info', disabled: !has, onClick: openInfo },
                { divider: true },
                { label: 'Xoay tất cả các trang', icon: 'rotate_right', disabled: !has, onClick: rotateAll },
                { label: sidebar.classList.contains('collapsed') ? 'Hiện các trang' : 'Ẩn các trang', icon: 'view_sidebar', disabled: !has, onClick: toggleSidebar }
            ], { alignRight: true });
        }
        function openSaveMenu(anchor) {
            openMenu(anchor, [
                { label: 'Lưu', icon: 'save', kbd: 'Ctrl S', onClick: () => saveDoc('save') },
                { label: 'Lưu thành bản sao…', icon: 'file_copy', onClick: () => saveDoc('copy') }
            ], { alignRight: true });
        }

        // ====================================================================
        //  Ghi chú thích vào PDF (pdf-lib, chỉ tải khi cần)
        // ====================================================================
        function loadScript(src) {
            return new Promise((res, rej) => {
                const s = document.createElement('script');
                s.src = src; s.onload = res;
                s.onerror = () => rej(new Error('Không tải được thư viện ' + src.split('/').slice(-1)[0] + ' (kiểm tra kết nối mạng)'));
                document.head.appendChild(s);
            });
        }
        let libsPromise = null;
        function loadLibs() {
            if (!libsPromise) libsPromise = (async () => {
                if (!window.PDFLib) await loadScript(LIBS.pdfLib);
                if (!window.fontkit) await loadScript(LIBS.fontkit);
            })().catch(e => { libsPromise = null; throw e; });
            return libsPromise;
        }
        const fontBytesCache = new Map();
        async function fetchFontBytes(key, bold, italic) {
            const url = fontUrl(key, bold, italic);
            if (!fontBytesCache.has(url)) {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Không tải được font ' + FONTS[key].label);
                fontBytesCache.set(url, new Uint8Array(await res.arrayBuffer()));
            }
            return fontBytesCache.get(url);
        }
        const hexRgb = hex => { const v = parseInt(hex.slice(1), 16); return PDFLib.rgb(((v >> 16) & 255) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255); };

        // Đo xem trình duyệt ngắt dòng chữ ở đâu (đúng như người dùng thấy) để PDF ngắt dòng y hệt
        async function measureText(a) {
            const f = FONTS[a.font] || FONTS.roboto;
            try { await document.fonts.load(`${a.italic ? 'italic ' : ''}${a.bold ? 700 : 400} ${a.size}px "${f.css}"`, a.text); } catch (e) {}
            const div = document.createElement('div');
            div.className = 'annMeasure';
            div.style.width = a.w + 'px';
            applyTextStyle(div, a);
            const probe = document.createElement('span');
            probe.className = 'probe';
            div.appendChild(probe);
            const tn = document.createTextNode(a.text);
            div.appendChild(tn);
            document.body.appendChild(div);
            const dr = div.getBoundingClientRect();
            const baseline0 = probe.getBoundingClientRect().bottom - dr.top;
            const lh = a.size * LH, text = a.text, lines = [];
            const range = document.createRange();
            let start = 0, lineTop = null;
            for (let i = 0; i < text.length;) {
                const cp = text.codePointAt(i), len = cp > 0xffff ? 2 : 1;
                if (text[i] === '\n') { lines.push({ text: text.slice(start, i), para: true }); start = i + 1; lineTop = null; i += 1; continue; }
                range.setStart(tn, i); range.setEnd(tn, i + len);
                const rects = range.getClientRects();
                if (rects.length) {
                    const top = rects[0].top;
                    if (lineTop === null) lineTop = top;
                    else if (top > lineTop + lh * 0.5) { lines.push({ text: text.slice(start, i), para: false }); start = i; lineTop = top; }
                }
                i += len;
            }
            lines.push({ text: text.slice(start), para: true });
            div.remove();
            return { lines, baseline0, lh };
        }

        async function buildEditedPdf() {
            if (docEncrypted) throw new Error('Chưa hỗ trợ lưu chỉnh sửa cho file có mật khẩu.');
            await loadLibs();
            const { PDFDocument, degrees, LineCapStyle } = PDFLib;
            const bytes = await pdfDoc.getData();
            const doc = await PDFDocument.load(bytes, { updateMetadata: false });
            doc.registerFontkit(fontkit);
            const pages = doc.getPages();
            const fonts = new Map(), images = new Map();
            const getFont = (key, bold, italic) => {
                const k = `${key}|${+bold}|${+italic}`;
                if (!fonts.has(k)) fonts.set(k, fetchFontBytes(key, bold, italic).then(b => doc.embedFont(b, { subset: true })));
                return fonts.get(k);
            };

            for (let n = 1; n <= pages.length; n++) {
                const pg = pages[n - 1], list = state.ann[n] || [];
                if (list.length) {
                    const jsPage = await pdfDoc.getPage(n);
                    const vp = jsPage.getViewport({ scale: 1, rotation: jsPage.rotate });
                    const P = (x, y) => vp.convertToPdfPoint(x, y);
                    const o0 = P(0, 0), o1 = P(1, 0);
                    const ang = Math.atan2(o1[1] - o0[1], o1[0] - o0[0]) * 180 / Math.PI;

                    for (const a of list) {
                        if (a.type === 'ink') {
                            const pts = a.pts.map(([x, y]) => { const p = P(x, y); return [p[0], -p[1]]; });   // pdf-lib lật trục y khi vẽ đường SVG
                            pg.drawSvgPath(inkPath(pts), { x: 0, y: 0, borderColor: hexRgb(a.color), borderWidth: a.width, borderOpacity: a.hl ? HL_OPACITY : 1, borderLineCap: LineCapStyle.Round });
                        } else if (a.type === 'sign') {
                            if (!images.has(a.src)) images.set(a.src, await doc.embedPng(a.src));
                            const p = P(a.x, a.y + a.h);
                            pg.drawImage(images.get(a.src), { x: p[0], y: p[1], width: a.w, height: a.h, rotate: degrees(ang) });
                        } else if (a.type === 'text' && a.text.trim()) {
                            const font = await getFont(a.font, a.bold, a.italic);
                            const m = await measureText(a);
                            const color = hexRgb(a.color);
                            const draw = (t, x, by) => { const p = P(a.x + x, a.y + by); pg.drawText(t.normalize('NFC'), { x: p[0], y: p[1], size: a.size, font, color, rotate: degrees(ang) }); };
                            m.lines.forEach((ln, i) => {
                                const t = ln.text.replace(/\s+$/, '');
                                if (!t) return;
                                const by = m.baseline0 + i * m.lh, wOf = s => font.widthOfTextAtSize(s.normalize('NFC'), a.size);
                                if (a.align === 'justify' && !ln.para && /\S\s+\S/.test(t)) {
                                    const words = t.trim().split(/\s+/), total = words.reduce((s, w) => s + wOf(w), 0);
                                    const gap = Math.max(0, (a.w - 2 * PAD - total) / (words.length - 1));
                                    let x = PAD;
                                    words.forEach(w => { draw(w, x, by); x += wOf(w) + gap; });
                                } else {
                                    const lw = wOf(t);
                                    const x = a.align === 'center' ? (a.w - lw) / 2 : a.align === 'right' ? a.w - PAD - lw : PAD;
                                    draw(t, x, by);
                                }
                            });
                        }
                    }
                }
                const r = userRot(n);
                if (r) pg.setRotation(degrees((pg.getRotation().angle + r) % 360));
            }
            doc.setModificationDate(new Date());
            return await doc.save();
        }

        // ====================================================================
        //  Lưu
        // ====================================================================
        function showBusy(msg) { $('print-status').textContent = msg; $('print-overlay').classList.add('active'); }
        function hideBusy() { $('print-overlay').classList.remove('active'); }

        function downloadBytes(bytes, name) {
            const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
            const a = el('a', { href: url, download: name });
            document.body.append(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
        }
        async function writeHandle(handle, bytes) {
            if ((await handle.queryPermission({ mode: 'readwrite' })) !== 'granted' && (await handle.requestPermission({ mode: 'readwrite' })) !== 'granted')
                throw new Error('Không có quyền ghi vào tệp.');
            const w = await handle.createWritable();
            await w.write(bytes);
            await w.close();
        }
        const copyName = () => (fileInfo.name || 'tai-lieu.pdf').replace(/\.pdf$/i, '') + ' (bản sao).pdf';

        async function saveDoc(mode) {
            closeMenu();
            if (!pdfDoc) return;
            if (editing) finishEdit();
            let bytes;
            showBusy('Đang lưu...');
            try { bytes = await buildEditedPdf(); }
            catch (e) { hideBusy(); toast('Lỗi khi lưu: ' + (e && e.message ? e.message : e)); console.error(e); return; }
            try {
                if (mode === 'copy') {
                    if (window.showSaveFilePicker) {
                        hideBusy();
                        const h = await window.showSaveFilePicker({ suggestedName: copyName(), types: [{ description: 'Tệp PDF', accept: { 'application/pdf': ['.pdf'] } }] });
                        showBusy('Đang lưu...');
                        await writeHandle(h, bytes);
                        fileInfo.handle = h; fileInfo.name = h.name;
                    } else { downloadBytes(bytes, copyName()); fileInfo.handle = null; fileInfo.name = copyName(); }
                } else if (fileInfo.handle && fileInfo.handle.createWritable) {
                    await writeHandle(fileInfo.handle, bytes);
                } else {
                    downloadBytes(bytes, fileInfo.name || 'tai-lieu.pdf');
                }
            } catch (e) {
                hideBusy();
                if (!e || e.name !== 'AbortError') toast('Lỗi khi lưu: ' + (e && e.message ? e.message : e));
                return;
            }
            const keep = { page: currPage, rel: relZoom() };
            fileInfo.size = bytes.length; fileInfo.lastModified = Date.now();
            try { await loadPDF(bytes, fileInfo.name, { restore: keep }); } finally { hideBusy(); }
            toast('Đã lưu');
        }

        window.addEventListener('beforeunload', e => { if (pdfDoc && isDirty()) { e.preventDefault(); e.returnValue = ''; } });

        // ====================================================================
        //  In
        // ====================================================================
        async function preparePrint() {
            if (!pdfDoc || printing) return;
            if (editing) finishEdit();
            printing = true;
            if (printCleanup) printCleanup();

            const status = $('print-status'), printZone = $('print-zone');
            const urls = [], imgs = [];
            let doc = pdfDoc, tmpDoc = null;
            showBusy('Đang chuẩn bị trang in...');
            printZone.textContent = '';

            const cleanup = () => {
                printZone.textContent = '';
                urls.forEach(u => URL.revokeObjectURL(u));
                urls.length = 0;
                if (tmpDoc) { try { tmpDoc.destroy(); } catch (e) {} tmpDoc = null; }
                window.removeEventListener('afterprint', cleanup);
                if (printCleanup === cleanup) printCleanup = null;
            };

            try {
                if (isDirty()) {                       // in bản đã chỉnh sửa: dựng PDF mới (có chú thích + xoay trang) rồi in từ đó
                    status.textContent = 'Đang áp dụng chỉnh sửa...';
                    const bytes = await buildEditedPdf();
                    tmpDoc = await pdfjsLib.getDocument(docOptions(bytes)).promise;
                    doc = tmpDoc;
                }
                for (let i = 1; i <= doc.numPages; i++) {
                    if (!tmpDoc && doc !== pdfDoc) throw new Error('Đã đổi sang file khác');
                    status.textContent = `Đang vẽ bản in: ${i} / ${doc.numPages}`;
                    const page = await doc.getPage(i);
                    const rot = page.rotate;
                    let s = PRINT_SCALE;
                    const vp0 = page.getViewport({ scale: s, rotation: rot });
                    if (vp0.width * vp0.height > MAX_CANVAS_PIXELS) s *= Math.sqrt(MAX_CANVAS_PIXELS / (vp0.width * vp0.height));
                    const vp = page.getViewport({ scale: s, rotation: rot });

                    const canvas = document.createElement('canvas');
                    canvas.width = Math.floor(vp.width);
                    canvas.height = Math.floor(vp.height);
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    await page.render({ canvasContext: ctx, viewport: vp }).promise;

                    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.92));
                    canvas.width = 0;
                    const url = URL.createObjectURL(blob);
                    urls.push(url);

                    const holder = document.createElement('div');
                    holder.className = 'print-page';
                    const img = new Image();
                    img.src = url;
                    holder.appendChild(img);
                    printZone.appendChild(holder);
                    imgs.push(img);
                }
                await Promise.all(imgs.map(img => img.decode().catch(() => {})));
            } catch (e) {
                hideBusy();
                cleanup();
                printing = false;
                alert('Lỗi chuẩn bị bản in: ' + (e && e.message ? e.message : e));
                return;
            }

            hideBusy();
            printCleanup = cleanup;
            window.addEventListener('afterprint', cleanup);
            printing = false;
            setTimeout(() => window.print(), 100);
        }

        // ====================================================================
        //  Giao diện chung
        // ====================================================================
        function updateUI() {
            const has = !!pdfDoc;
            ['share-btn', 'zoom-btn', 'print-btn'].forEach(id => $(id).disabled = !has);
            document.querySelectorAll('[data-toolbtn]').forEach(b => b.disabled = !has);
            $('curr-page-input').disabled = !has;
            $('undo-btn').disabled = !has || hi <= 0;
            $('redo-btn').disabled = !has || hi >= hist.length - 1;
            $('delete-btn').hidden = !sel;
            $('save-split').hidden = !(has && isDirty());
            $('open-btn').hidden = has;
            $('sidebar-expand').hidden = !(has && sidebar.classList.contains('collapsed'));
        }

        // ===== Phím tắt =====
        window.addEventListener('keydown', e => {
            const mod = e.ctrlKey || e.metaKey, k = (e.key || '').toLowerCase();
            const typing = e.target && (e.target.isContentEditable || /^(input|textarea|select)$/i.test(e.target.tagName));
            if (mod && k === 'p' && pdfDoc) { e.preventDefault(); preparePrint(); return; }
            if (mod && k === 's') { e.preventDefault(); if (pdfDoc && isDirty()) saveDoc('save'); return; }
            if (typing) return;
            if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
            if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }
            if (mod && (k === '+' || k === '=')) { e.preventDefault(); zoomIn(); return; }
            if (mod && k === '-') { e.preventDefault(); zoomOut(); return; }
            if (mod && k === '0') { e.preventDefault(); setZoom(1); return; }
            if ((k === 'delete' || k === 'backspace') && sel) { e.preventDefault(); deleteSelected(); return; }
            if (k === 'escape') {
                if (!$('info-sheet').hidden) closeInfo();
                else if (sel) clearSel();
                else if (tool) setTool(tool);
            }
        });

        // ===== Kéo resize sidebar (chuột + cảm ứng) =====
        const handle = $('resize-handle');
        let isResizing = false;
        handle.addEventListener('pointerdown', e => {
            isResizing = true;
            sidebar.classList.add('resizing');
            handle.classList.add('active');
            handle.setPointerCapture(e.pointerId);
        });
        handle.addEventListener('pointermove', e => {
            if (!isResizing) return;
            const x = e.clientX - sidebar.getBoundingClientRect().left;
            if (x > 100 && x < 500) sidebar.style.width = x + 'px';
        });
        const stopResize = () => { isResizing = false; sidebar.classList.remove('resizing'); handle.classList.remove('active'); };
        handle.addEventListener('pointerup', stopResize);
        handle.addEventListener('pointercancel', stopResize);

        updateUI();
    </script>
